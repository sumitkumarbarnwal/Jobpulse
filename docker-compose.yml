version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - JOB_SOURCE=${JOB_SOURCE:-arbeitnow}
      - DATABASE_URL=sqlite:///./jobpulse.db
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
      - HTTP_TIMEOUT_SECONDS=30
      - HTTP_MAX_RETRIES=3
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend
